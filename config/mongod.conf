# MongoDB Community Edition — replica-set member wired to the self-managed
# mongot search process. (Migrated from Percona Server for MongoDB.)
#
# The three setParameter values below are the OFFICIAL way to wire mongod →
# mongot (see MongoDB docs: "Deploy a Replica Set … for mongot"). mongotHost
# and searchIndexManagementHostAndPort point mongod at the mongot process, and
# useGrpcForSearch switches the search transport to gRPC, which mongot 0.65+
# requires (the old wire protocol gets rejected with an HTTP/2 preface error).
# useGrpcForSearch needs MongoDB 8.1 or newer — pin an 8.0.x image and mongod
# exits with Unknown --setParameter 'useGrpcForSearch'. The old
# skipAuthenticationToSearchIndexManagementServer flag was Percona-only and is
# not needed here.
storage:
  dbPath: /data/db
net:
  port: 27017
  bindIpAll: true
setParameter:
  mongotHost: mongot.warden-net:27027
  searchIndexManagementHostAndPort: mongot.warden-net:27027
  # mongot 0.65 speaks gRPC only; without this, mongod uses the old wire protocol
  # and mongot rejects it ("HTTP/2 client preface … missing or corrupt").
  useGrpcForSearch: true
replication:
  replSetName: rs0
# Beta runs the replica set WITHOUT auth for zero-config onboarding, matching the
# previous setup. To harden (production), add a keyfile + authorization: enabled
# here and on every node (see docs "Production hardening" in CLAUDE.md).
