[pytest]
# The app is a flat package of top-level modules (coverage.py, store.py, ...),
# so put app/ on sys.path for imports like `import coverage`.
#
# `.` (the repo root) is needed so `tests/` resolves as a package for imports like
# `from tests.eval import dataset`. Without it, bare `pytest` fails to collect
# tests/test_eval_harness.py while `python -m pytest` succeeds — because `-m` puts the
# CWD on sys.path and script invocation does not. CI runs bare `pytest`, so relying on
# that difference means the suite passes locally one way and fails in CI the other.
pythonpath = . app
testpaths = tests
addopts = -q
markers =
    dbintegration: requires a live MongoDB (set MONGO_TEST_URI); run via the
        dedicated "db-integration-tests" CI job, or locally with
        `MONGO_TEST_URI=mongodb://localhost:27017 pytest -m dbintegration`.
        Excluded from the default `pytest` run (see -m in CI's unit-test job).
